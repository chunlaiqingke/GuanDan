syntax = "proto3";

package guandan;

// =====================================================================
// Phase 01 基础消息定义
// 每个 WS 二进制帧 = 一条完整业务消息，帧格式：[2B cmd][2B ver][4B len][body]
// =====================================================================

// ---- 1001 C2S_Login ----
message LoginReq {
  string uid = 1;    // 玩家 uid
  string token = 2;  // 鉴权 token
}

// ---- 1002 S2C_LoginAck ----
message LoginAck {
  int32 code = 1;        // 0 = 成功
  int64 player_id = 2;   // 服务端分配的玩家 id
  string msg = 3;        // 附加信息
}

// ---- 房间规则配置（Phase 01 占位，后续 Phase 02 扩展）----
message RoomRuleConfig {
  int32 level = 1;        // 当前级牌点数（2~A，占位）
  bool enable_gong = 2;   // 是否进贡
}

// ---- 2001 C2S_CreateRoom ----
message CreateRoomReq {
  RoomRuleConfig rule = 1;
}

// ---- 2002 S2C_CreateRoomAck ----
message CreateRoomAck {
  int32 code = 1;      // 0 = 成功
  string room_id = 2;  // 房间号
  string msg = 3;
}

// ---- 2003 C2S_JoinRoom ----
message JoinRoomReq {
  string room_id = 1;
}

// ---- 房间玩家快照 ----
message RoomPlayer {
  int64 player_id = 1;
  string name = 2;
  int32 seat = 3;      // 座位号 0~3
  bool is_bot = 4;
}

// ---- 2004 S2C_RoomState ----
message RoomState {
  int32 code = 1;                     // 0 = 成功
  string room_id = 2;
  repeated RoomPlayer players = 3;
  string msg = 4;
}

// ---- 2005 C2S_Reconnect ----
message ReconnectReq {
  int64 player_id = 1;
  string room_id = 2;
}

// ---- 9001 C2S_Heartbeat ----
message HeartbeatReq {
  int64 ts = 1;  // 客户端时间戳
}

// ---- 9002 S2C_HeartbeatAck ----
message HeartbeatAck {
  int64 ts = 1;  // 回显时间戳
}

// ---- 9999 S2C_Error ----
message ErrorMsg {
  int32 code = 1;
  string msg = 2;
}

// =====================================================================
// Phase 03 对战流消息（单盘跑通）
// =====================================================================

// ---- 3005 C2S_SetHost：主动托管/取消托管 ----
message SetHostReq {
  bool host = 1;
}

// ---- 3001 S2C_TurnStart：轮到某人 ----
message TurnStart {
  int64 uid = 1;          // 当前操作人 playerId
  int64 deadline_ts = 2;  // 截止时间（单调时钟 ms）
  bool can_pass = 3;      // 是否可过（跟牌 true）
}

// ---- 3002 S2C_Tick：最后 5s 倒计时 ----
message Tick {
  int32 remain_ms = 1;
}

// ---- 3003 S2C_AutoPlay：超时/托管自动出牌 ----
message AutoPlay {
  int64 uid = 1;
  repeated int32 cards = 2;
  bool is_pass = 3;    // true 表示自动过牌
  int32 reason_tag = 4; // 出牌理由标签（见 03-ai-design）
}

// ---- 3004 S2C_HostMode：托管状态 ----
message HostMode {
  int64 uid = 1;
  bool is_host = 2;
}

// ---- 3006 C2S_Play：出牌 ----
message PlayReq {
  repeated int32 cards = 1;  // 牌编码 rank*4+suit
}

// ---- 3007 C2S_Pass：过牌 ----
message PassReq {}

// ---- 3008 S2C_Deal：发牌（发给本人） ----
message Deal {
  int32 level = 1;          // 当前级牌
  int32 your_seat = 2;
  repeated int32 cards = 3; // 本人手牌
  repeated int64 seats = 4; // seat 顺序对应的 playerId
}

// ---- 3009 S2C_RoundEnd：一盘结束 ----
message RoundEnd {
  repeated int64 finish_order = 1;  // 头游→二游→三游 playerId
  int32 level_up = 2;
  int64 last_uid = 3;               // 末游
}

// ---- 3010 S2C_GameStart：开局广播 ----
message GameStart {
  int32 level = 1;
  int64 first_uid = 2;  // 首出者
}

// ---- 3011 S2C_PlayResult：广播出牌 ----
message PlayResultMsg {
  int64 uid = 1;
  repeated int32 cards = 2;
}

// ---- 3012 S2C_PassResult：广播过牌 ----
message PassResultMsg {
  int64 uid = 1;
}

// ---- 3013 C2S_AddBot：补位机器人 ----
message AddBotReq {
  int32 count = 1;  // 补几个（缺省 1）
}

// ---- 3014 C2S_Hint：请求提示出牌 ----
message HintReq {}

// ---- 3015 S2C_HintAck：Top3 推荐 ----
message HintPlay {
  repeated int32 cards = 1;
  int32 reason_tag = 2;  // 推荐理由标签
}
message HintAck {
  int32 code = 1;
  repeated HintPlay plays = 2;
}

// ---- 3016 C2S_StartMatch：开始匹配 ----
message StartMatchReq {}

// ---- 3017 C2S_CancelMatch：取消匹配 ----
message CancelMatchReq {}

// ---- 3018 S2C_MatchAck：匹配成功 ----
message MatchAck {
  int32 code = 1;
  string room_id = 2;
  int32 level = 3;
}

// ---- 3019 S2C_RankUpdate：段位结算 ----
message RankInfo {
  int64 player_id = 1;
  int32 old_rating = 2;
  int32 new_rating = 3;
  int32 delta = 4;
  string tier = 5;
}
message RankUpdate {
  repeated RankInfo updates = 1;
}
